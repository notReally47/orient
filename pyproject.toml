[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "orient"
version = "0.1.0"
description = "Agentic market summary workflow: MCP tools, skills, and a LiteLLM-backed orchestrator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.141",
    "httpx>=0.28",
    "mcp>=2",
    "openai>=3",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44",
    "pandas>=2.2",
    "pandas-datareader>=0.11",
    "pgvector>=0.5",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "sse-starlette>=3.4",
    "uvicorn[standard]>=0.52",
    "yfinance>=1.5",
]
optional-dependencies.dev = [
    "basedpyright>=1.39",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-socket>=0.8",
    "ruff>=0.16",
]
optional-dependencies.gui = [
    "streamlit>=1.61",
    "streamlit-echarts>=0.7",
]
scripts.orient-mcp = "orient.mcp.server:main"
scripts.orient-probe = "orient.probe:main"

[tool.hatch]
build.targets.wheel.packages = ["src/orient"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
extend-exclude = [".claude", ".venv"]
lint.select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "EM",
    "F",
    "FLY",
    "G",
    "I",
    "ICN",
    "ISC",
    "N",
    "PERF",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
]
lint.ignore = [
    "ANN401",
    "ISC001",
]
lint.per-file-ignores."src/orient/probe.py" = ["T201"]
lint.per-file-ignores."tests/**" = ["PLR2004", "S101", "SLF001"]
lint.flake8-tidy-imports.ban-relative-imports = "all"
lint.pylint.max-args = 8

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.addopts = """\
    -ra -q --allow-hosts=127.0.0.1,::1 -m 'not integration' --cov=orient --cov-report=term-missing \
    --cov-fail-under=85\
    """
ini_options.markers = [
    "integration: needs the live Postgres from `make up`; run these with `make test-integration`",
]
ini_options.filterwarnings = ["error"]
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.branch = true
run.source = ["src/orient"]

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
enableTypeIgnoreComments = false
reportAny = "error"
reportExplicitAny = "error"
reportMissingTypeStubs = false
reportUnknownMemberType = "error"
