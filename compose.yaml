name: orient

services:
  db:
    image: docker.io/pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-market}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-market}
      POSTGRES_DB: ${POSTGRES_DB:-orient}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/bootstrap:/docker-entrypoint-initdb.d:ro,z
    healthcheck:
      test: [ "CMD-SHELL", "psql -U ${POSTGRES_USER:-market} -d litellm -c 'SELECT 1' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686"
      - "4318:4318"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:16686/ >/dev/null 2>&1 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 12

  headroom:
    image: ghcr.io/chopratejas/headroom:0.6.7
    command: [ "--port", "8787", "--host", "0.0.0.0" ]
    ports:
      - "8787:8787"

  mcp:
    build:
      context: .
      target: service
    depends_on:
      db:
        condition: service_healthy
    command: [ "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "9000" ]
    environment:
      MS_DATABASE_URL: postgresql://${POSTGRES_USER:-market}:${POSTGRES_PASSWORD:-market}@db:5432/${POSTGRES_DB:-orient}
      MS_PROXY_BASE_URL: http://litellm:4000
      MS_PROXY_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      MS_EMBEDDING_MODEL: ${MS_EMBEDDING_MODEL:-embedding-model}
      MS_EMBEDDING_DIMENSIONS: ${MS_EMBEDDING_DIMENSIONS:-1536}
      MS_SEARCH_TOOL_NAME: ${MS_SEARCH_TOOL_NAME:-exa-search}
      MS_FAST_MODEL: ${MS_FAST_MODEL:-fast-model}
    ports:
      - "9000:9000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9000), 2).close()" ]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:v1.96.2
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    command: [ "--config", "/app/proxy/config.yaml", "--port", "4000", "--detailed_debug", "--use_v2_migration_resolver" ]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-market}:${POSTGRES_PASSWORD:-market}@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in .env}
      GEMINI_API_KEY_2: ${GEMINI_API_KEY_2:?set GEMINI_API_KEY_2 in .env}
      GEMINI_API_KEY_3: ${GEMINI_API_KEY_3:?set GEMINI_API_KEY_3 in .env}
      GEMINI_API_KEY_4: ${GEMINI_API_KEY_4:?set GEMINI_API_KEY_4 in .env}
      GEMINI_API_KEY_5: ${GEMINI_API_KEY_5:?set GEMINI_API_KEY_5 in .env}
      GEMINI_API_KEY_6: ${GEMINI_API_KEY_6:?set GEMINI_API_KEY_6 in .env}
      GEMINI_API_KEY_7: ${GEMINI_API_KEY_7:?set GEMINI_API_KEY_7 in .env}
      GEMINI_API_KEY_8: ${GEMINI_API_KEY_8:?set GEMINI_API_KEY_8 in .env}
      GEMINI_API_KEY_9: ${GEMINI_API_KEY_9:?set GEMINI_API_KEY_9 in .env}
      GEMINI_API_KEY_10: ${GEMINI_API_KEY_10:?set GEMINI_API_KEY_10 in .env}
      GEMINI_API_KEY_11: ${GEMINI_API_KEY_11:?set GEMINI_API_KEY_11 in .env}
      GEMINI_API_KEY_12: ${GEMINI_API_KEY_12:?set GEMINI_API_KEY_12 in .env}
      EXA_API_KEY: ${EXA_API_KEY:?set EXA_API_KEY in .env}
      HEADROOM_API_BASE: http://headroom:8787
      MAX_STRING_LENGTH_PROMPT_IN_DB: "32768"
      LITELLM_OTEL_V2: "true"
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://jaeger:4318
      OTEL_SERVICE_NAME: litellm-proxy
    volumes:
      - ./proxy:/app/proxy:ro,z
      - ./proxy/custom_guardrail.py:/app/custom_guardrail.py:ro,z
    ports:
      - "4000:4000"

  orchestrator:
    build:
      context: .
      target: service
    entrypoint: [ "orient-orchestrator" ]
    command: [ "--host", "0.0.0.0", "--port", "8000" ]
    depends_on:
      db:
        condition: service_healthy
      mcp:
        condition: service_healthy
    environment:
      MS_DATABASE_URL: postgresql://${POSTGRES_USER:-market}:${POSTGRES_PASSWORD:-market}@db:5432/${POSTGRES_DB:-orient}
      MS_PROXY_BASE_URL: http://litellm:4000
      MS_PROXY_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      MS_MCP_URL: http://mcp:9000/mcp
      MS_OTLP_ENDPOINT: http://jaeger:4318
      MS_PRIMARY_MODEL: ${MS_PRIMARY_MODEL:-primary-model}
      MS_FAST_MODEL: ${MS_FAST_MODEL:-fast-model}
      MS_GATHER_MODEL: ${MS_GATHER_MODEL:-primary-model}
      MS_EMBEDDING_MODEL: ${MS_EMBEDDING_MODEL:-embedding-model}
      MS_EMBEDDING_DIMENSIONS: ${MS_EMBEDDING_DIMENSIONS:-1536}
      MS_REQUESTS_PER_MINUTE: ${MS_REQUESTS_PER_MINUTE:-15}
      MS_MAX_TURNS: ${MS_MAX_TURNS:-18}
    ports:
      - "8000:8000"

  gui:
    build:
      context: .
      target: gui
    depends_on:
      orchestrator:
        condition: service_started
    environment:
      MS_ORCHESTRATOR_BASE_URL: http://orchestrator:8000
    ports:
      - "8501:8501"

volumes:
  pgdata: