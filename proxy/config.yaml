include:
  - model_config.yaml
  - guardrails_config.yaml

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 60
  allowed_fails_policy:
    RateLimitErrorAllowedFails: 0

search_tools:
  - search_tool_name: exa-search
    litellm_params:
      search_provider: exa_ai
      api_key: os.environ/EXA_API_KEY

litellm_settings:
  drop_params: true
  cache: false
  # Puts session_id and trace_id on every log line, which is what lets one run's turns be
  # filtered together in the dashboard rather than read out of a wall of unrelated rows.
  request_correlation_in_logs: true

mcp_servers:
  orient:
    url: "http://mcp:9000/mcp"
    transport: http

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true