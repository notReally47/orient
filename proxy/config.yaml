model_list:
  - model_name: primary-model
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      cache_control_injection_points:
        - location: message
          role: system

  - model_name: fast-model
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY

  - model_name: judge-model
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: embedding-model
    litellm_params:
      model: gemini/gemini-embedding-2
      api_key: os.environ/GEMINI_API_KEY
      dimensions: 1536

  # Gemini free-tier quota is per Google Cloud project, not per key. Duplicating a
  # model_name with a key from a SECOND project multiplies throughput; a second key
  # from the same project does not. Uncomment once GEMINI_API_KEY_2 names another project.
  # - model_name: fast-model
  #   litellm_params:
  #     model: gemini/gemini-3.5-flash-lite
  #     api_key: os.environ/GEMINI_API_KEY_2

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 3
  cooldown_time: 30

search_tools:
  - search_tool_name: exa-search
    litellm_params:
      search_provider: exa_ai
      api_key: os.environ/EXA_API_KEY

guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: os.environ/HEADROOM_API_BASE
      unreachable_fallback: fail_open

  - guardrail_name: quality-judge
    litellm_params:
      guardrail: llm_as_a_judge
      mode: post_call
      judge_model: judge-model
      overall_threshold: 75
      on_failure: block
      criteria:
        - name: faithfulness
          weight: 40
          description: >-
            Every figure and every causal claim is traceable to the market data supplied in the
            prompt. Fails if a number contradicts the data, or if a cause is asserted with no
            supporting figure.
        - name: compliance
          weight: 25
          description: >-
            No investment advice, no forecasting of future prices or levels, and no allegation of
            misconduct by any person or company. Stating a scheduled event is fine; predicting its
            outcome is not. Naming a gap in an earlier explanation is fine; speculating about
            motive is not.
        - name: completeness
          weight: 20
          description: >-
            Each section answers its own question. "What moved, and why" must give causes, not just
            name the movers. A section may be omitted when its data is absent, but not left hollow.
        - name: clarity_for_level
          weight: 15
          description: >-
            Matches the requested reading level. For beginner, no jargon is used without its plain
            meaning in the same sentence, and every figure is followed by what it means. For
            advanced, no padding: prose is reserved for causality that needs explaining.

litellm_settings:
  drop_params: true
  cache: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY