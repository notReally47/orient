# One deployment per API key per role. Every key is its own Google project, and the free tier
# counts requests per project per model, so the fan-out is what turns a twenty-a-day ceiling
# into 12 times that. No `order`: it filters rather than tie-breaks, and setting it pins every
# request to the lowest-numbered group.
#
# Generated from the keys present in .env. A key removed there must be removed here and in
# compose.yaml, and the remaining ones renumbered to stay contiguous.

model_list:
  - model_name: primary-model
    litellm_params:
      model: gemini/gemini-3.6-flash
      api_key: os.environ/GEMINI_API_KEY
      cache_control_injection_points:
        - location: message
          role: system

  - model_name: primary-model
