guardrails:
  - guardrail_name: headroom-compression
    litellm_params:
      guardrail: headroom
      mode: pre_call
      api_base: os.environ/HEADROOM_API_BASE
      unreachable_fallback: fail_open
      default_on: true

  - guardrail_name: quality-judge
    litellm_params:
      guardrail: llm_as_a_judge
      mode: post_call
      judge_model: judge-model
      overall_threshold: 75
      on_failure: block
      criteria:
        - name: faithfulness
          weight: 40
          description: >-
            Nothing is presented as more certain, or better sourced, than it is. A cause taken
            from news is attributed to what reported it; a cause read off the measurements says
            which. Fails if a figure contradicts the data supplied, if something reported is
            written as though it were measured, or if a cause is asserted with no source of any
            kind. It does not fail merely because a cause has no figure beside it: causes
            frequently come from reporting, which carries no measurement, and every figure in the
            prose has already been reconciled against the data deterministically before you see
            it, so re-checking arithmetic is not your job.
        - name: compliance
          weight: 25
          description: >-
            No investment advice, no forecasting of future prices or levels, and no allegation of
            misconduct by any person or company. Stating a scheduled event is fine; predicting its
            outcome is not. Naming a gap in an earlier explanation is fine; speculating about
            motive is not.
        - name: completeness
          weight: 20
          description: >-
            Each section answers its own question. "What moved, and why" must give causes, not just
            name the movers. A section may be omitted when its data is absent, but not left hollow.
        - name: clarity_for_level
          weight: 15
          description: >-
            Matches the requested reading level. Every figure is followed by what it means for
            this instrument on this day: whether it is large, and what follows from it. Defining
            the term itself belongs in the glossary and its absence from the prose is correct, so
            do not mark a summary down for using a term without explaining it. Do mark one down
            for stating a figure and moving on without saying whether it matters. For advanced,
            no padding: prose is reserved for causality that needs explaining.

  - guardrail_name: tool-budget
    litellm_params:
      guardrail: custom_guardrail.ToolBudget
      mode: post_call
      default_budget: 3
      tool_rules:
        - id: skills
          tool_name: "^(activate_skill|read_skill_resource)$"
          budget: 8
        - id: market-data
          tool_name: "^(compute_instrument_signals|get_market_context|get_instrument_profile|get_calendar|get_earnings_detail|discover_instruments)$"
          budget: 3
        - id: price-history
          tool_name: "^get_price_history$"
          budget: 2
          allowed_param_patterns:
            days: "^([1-9][0-9]?|[1-3][0-9]{2}|400)$"
        - id: research-and-memory
          tool_name: "^(search_news|recall_history|search_knowledge)$"
          budget: 3
        - id: write-boundary
          tool_name: "^save_summary$"
          uncounted: true
